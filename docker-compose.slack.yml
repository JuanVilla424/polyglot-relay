---
# Work/Slack deployment stack: its own containers and volumes, fully separate
# from the Discord stack in docker-compose.yml. Run with:
#   docker compose -f docker-compose.slack.yml up -d --build
services:
  libretranslate:
    container_name: polyglot-relay-slack-libretranslate
    image: libretranslate/libretranslate:v1.9.6
    restart: always
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 10s
      timeout: 4s
      retries: 4
      start_period: 5s
    volumes:
      - slack-libretranslate-models:/home/libretranslate/.local:rw

  nllb:
    container_name: polyglot-relay-slack-nllb
    build: ./nllb
    restart: always
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 4s
      retries: 4
      start_period: 5s
    volumes:
      - slack-nllb-model:/models
      # Directory mount, not a file mount: if glossary.json is absent Docker
      # would create it as a directory; the directory itself is always in git.
      - ./config:/config:ro

  slack-bot:
    container_name: polyglot-relay-slack-bot
    build:
      context: .
      dockerfile: slack_app/Dockerfile
    restart: always
    depends_on:
      libretranslate:
        condition: service_healthy
      nllb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - LIBRETRANSLATE_URL=http://libretranslate:5000
      - NLLB_URL=http://nllb:8000
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/healthy -mmin -1 | grep -q ."]
      interval: 15s
      timeout: 4s
      retries: 4
      start_period: 15s
    volumes:
      - polyglot-relay-slack-data:/app/data

volumes:
  slack-libretranslate-models:
  slack-nllb-model:
  polyglot-relay-slack-data:
