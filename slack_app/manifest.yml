---
# Slack app manifest for the polyglot-relay Slack adapter.
#
# Create the app at https://api.slack.com/apps -> "Create New App" ->
# "From a manifest", paste this file, then install the app to the workspace.
# Socket Mode needs an app-level token (Basic Information -> App-Level
# Tokens) with the connections:write scope; the bot token comes from
# OAuth & Permissions after installing.
display_information:
  name: polyglot-relay
  description: Self-hosted on-demand translation
  background_color: "#2c2d30"
features:
  bot_user:
    display_name: polyglot-relay
    always_online: true
  shortcuts:
    - name: Translate message
      type: message
      callback_id: translate_message
      description: Translate this message to your language, visible only to you
  slash_commands:
    - command: /polyglot-lang
      description: Set your translation language (code, clear, or list)
      usage_hint: "[code|clear|list]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - channels:history
      - groups:history
      - reactions:read
      - chat:write
      - commands
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - reaction_added
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
