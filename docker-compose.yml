---
services:
  libretranslate:
    container_name: polyglot-relay-libretranslate
    image: libretranslate/libretranslate:v1.9.6
    restart: always
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 10s
      timeout: 4s
      retries: 4
      start_period: 5s
    volumes:
      - libretranslate-models:/home/libretranslate/.local:rw

  bot:
    container_name: polyglot-relay-bot
    build: .
    restart: always
    depends_on:
      libretranslate:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - LIBRETRANSLATE_URL=http://libretranslate:5000
    volumes:
      - ./data:/app/data

volumes:
  libretranslate-models:
