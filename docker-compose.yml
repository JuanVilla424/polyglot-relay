---
services:
  libretranslate:
    container_name: polyglot-relay-libretranslate
    image: libretranslate/libretranslate:v1.9.6
    restart: always
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 10s
      timeout: 4s
      retries: 4
      start_period: 5s
    volumes:
      - libretranslate-models:/home/libretranslate/.local:rw

  nllb:
    container_name: polyglot-relay-nllb
    build: ./nllb
    restart: always
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 4s
      retries: 4
      start_period: 5s
    volumes:
      - nllb-model:/models

  bot:
    container_name: polyglot-relay-bot
    build: .
    restart: always
    depends_on:
      libretranslate:
        condition: service_healthy
      nllb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - LIBRETRANSLATE_URL=http://libretranslate:5000
      - NLLB_URL=http://nllb:8000
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/healthy -mmin -1 | grep -q ."]
      interval: 15s
      timeout: 4s
      retries: 4
      start_period: 15s
    volumes:
      - polyglot-relay-data:/app/data

volumes:
  libretranslate-models:
  nllb-model:
  polyglot-relay-data:
